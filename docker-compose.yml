services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qom-ce-association
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    networks: [web]

networks:
  web:
    external: true
